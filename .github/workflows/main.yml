name: LandRent Bot bauen

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Java 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Bot-Projekt entpacken
        run: |
          mkdir -p extracted
          unzip -q LandRent_3Gleiche_Bot_v2.zip -d extracted
          PROJECT_DIR=$(find extracted -name settings.gradle.kts -o -name settings.gradle | head -1 | xargs dirname)
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: APK bauen
        run: |
          cd "$PROJECT_DIR"
          echo "kotlin.jvm.target.validation.mode=warning" >> gradle.properties
          gradle --no-daemon assembleDebug

      - name: APK speichern
        uses: actions/upload-artifact@v4
        with:
          name: LandRent-3-Gleiche-Bot
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
